backend:
  name: git-gateway
  branch: main

# This gives you a web editor at hotmamatravel.com/admin/
# Log in with your GitHub account — no separate password needed

media_folder: "public/images"
public_folder: "/images"

site_url: https://hotmamatravel.com
display_url: https://hotmamatravel.com
logo_url: https://hotmamatravel.com/images/hmt-logo.png

# Show live preview while editing
show_preview_links: true

collections:
  # ---- BLOG POSTS ----
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    preview_path: "/{{slug}}/"
    identifier_field: title
    view_filters:
      - { label: "Drafts Only", field: "draft", pattern: true }
      - { label: "Published Only", field: "draft", pattern: false }
    view_groups:
      - { label: "Publish Status", field: "draft" }
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The main headline — make it descriptive and keyword-rich" }
      - { label: "Description / Excerpt", name: "description", widget: "text", required: false, hint: "1-2 sentence summary for SEO and social sharing (160 chars max)" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", default: "", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Hero Image URL", name: "heroImage", widget: "image", required: false, hint: "Main post image (shown in cards and at top of post)" }
      - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string", required: false, hint: "Describe the image for accessibility and SEO" }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Family Travel"
        options:
          - "Family Travel"
          - "Las Vegas"
          - "California"
          - "Florida"
          - "Canada"
          - "Europe"
          - "Caribbean"
          - "Hotel Review"
          - "Buyer's Guide"
          - "Travel Tips"
      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "Add relevant tags (e.g. las-vegas, family-hotels, kids, teens)"
        field: { label: Tag, name: tag, widget: string }
      - { label: "Featured Post?", name: "featured", widget: "boolean", default: false, hint: "Show this post in the featured slot on the homepage" }
      - { label: "Draft?", name: "draft", widget: "boolean", default: false, hint: "Draft posts won't appear on the live site" }
      - label: "SEO Title Override"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Override the page title tag for SEO (leave blank to use post title)"
      - label: "SEO Description Override"
        name: "seoDescription"
        widget: "text"
        required: false
        hint: "Override the meta description for SEO (leave blank to use Description above)"
      - { label: "Body", name: "body", widget: "richtext", hint: "Write your post here. Use the toolbar for headers, bold, links, and images." }

  # ---- STATIC PAGES ----
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - label: "About Me"
        name: "about"
        file: "src/content/blog/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description / Excerpt", name: "description", widget: "text", required: false }
          - { label: "Hero Image URL", name: "heroImage", widget: "image", required: false }
          - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "richtext" }
          - { label: "SEO Title Override", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO Description Override", name: "seoDescription", widget: "text", required: false }
          - { label: "Publish Date", name: "pubDate", widget: "hidden", required: false }
          - { label: "Updated Date", name: "updatedDate", widget: "hidden", required: false }
          - { label: "WordPress ID", name: "wpId", widget: "hidden", required: false }
          - { label: "WordPress Slug", name: "wpSlug", widget: "hidden", required: false }
          - { label: "Author", name: "author", widget: "hidden", default: "Amanda Keeley-Thurman", required: false }

      - label: "Contact"
